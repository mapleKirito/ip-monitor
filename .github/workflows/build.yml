name: 跨平台打包

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: IPMonitor-Windows
            archive_cmd: Compress-Archive -Path "dist/IPMonitor.exe" -DestinationPath "IPMonitor-Windows.zip"
          - os: ubuntu-latest
            platform: linux
            artifact_name: IPMonitor-Linux
            archive_cmd: tar -czf IPMonitor-Linux.tar.gz -C dist IPMonitor
          - os: macos-latest
            platform: macos
            artifact_name: IPMonitor-macOS
            archive_cmd: tar -czf IPMonitor-macOS.tar.gz -C dist IPMonitor

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 编译 PyInstaller
      run: |
        pyinstaller --onefile --windowed --name IPMonitor main.py

    - name: 打包压缩
      run: ${{ matrix.archive_cmd }}

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          IPMonitor-${{ matrix.platform }}.zip
          IPMonitor-${{ matrix.platform }}.tar.gz
          config.json

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 下载 Windows 产物
      uses: actions/download-artifact@v4
      with:
        name: IPMonitor-Windows
        path: artifacts

    - name: 下载 Linux 产物
      uses: actions/download-artifact@v4
      with:
        name: IPMonitor-Linux
        path: artifacts

    - name: 下载 macOS 产物
      uses: actions/download-artifact@v4
      with:
        name: IPMonitor-macOS
        path: artifacts

    - name: 查找并整理发布文件
      run: |
        mkdir -p release
        find artifacts -name "*.zip" -exec cp {} release/ \;
        find artifacts -name "*.tar.gz" -exec cp {} release/ \;
        cp artifacts/config.json release/ 2>/dev/null || true
        ls -lh release/

    - name: 获取版本号
      id: get_version
      run: |
        VERSION=release-$(date +%Y%m%d-%H%M%S)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: IP Monitor v${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release/*.zip
          release/*.tar.gz
          release/config.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
